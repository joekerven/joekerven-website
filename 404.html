<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Adrift — Joe Kerven</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Sans:wght@300;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif; text-align: center; padding: 2rem;
      background: linear-gradient(160deg, #0A1F28 0%, #0D3040 40%, #1A5C70 100%);
      color: #F5F0E8;
    }
    .inner { max-width: 540px; }
    .code {
      font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: #5A9BAB; margin-bottom: 1.5rem;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic;
      font-weight: 300; font-size: clamp(2.5rem, 7vw, 4rem); line-height: 1.1;
      margin-bottom: 1.25rem;
    }
    p { font-weight: 300; font-size: 0.95rem; line-height: 1.9; color: rgba(245,240,232,0.6); margin-bottom: 2.5rem; }
    a {
      display: inline-block; padding: 0.85rem 2rem; font-size: 0.8rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none;
      color: #0A1F28; background: #F5F0E8; transition: background 0.3s ease;
    }
    a:hover { background: #E8DFD0; }
  </style>
</head>
<body>
  <div class="inner">
    <p class="code">404 — Page not found</p>
    <h1>You've drifted off course.</h1>
    <p>The tide took this page somewhere else. It happens to the best of us.</p>
    <a href="/">Back to shore →</a>
  </div>
</body>
</html>
